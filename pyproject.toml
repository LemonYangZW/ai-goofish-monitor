[project]
name = "ai-goofish-monitor"
version = "2.5.0"
description = "基于 Playwright 和 AI 的闲鱼多任务实时监控与智能分析系统，配备 Web 管理界面"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: real traffic smoke tests that require real credentials and external services",
    "live_slow: slower optional live smoke tests such as AI task generation",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
